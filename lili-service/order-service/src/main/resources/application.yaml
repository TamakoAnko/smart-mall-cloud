server:
  port: 8892

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            readTimeout: ${FEIGN_READ_TIMEOUT:10000}
            loggerLevel: ${FEIGN_LOG_LEVEL:basic}
      compression:
        request:
          enabled: ${FEIGN_REQUEST_COMPRESSION:false}
        response:
          enabled: ${FEIGN_RESPONSE_COMPRESSION:false}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: GMT+8
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lilishop}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml

lili:
  runtime:
    mode: microservice
  jwt-setting:
    tokenExpireTime: ${JWT_TOKEN_EXPIRE_MINUTES:259200}
  thread:
    corePoolSize: ${ASYNC_CORE_POOL_SIZE:5}
    maxPoolSize: ${ASYNC_MAX_POOL_SIZE:50}
    queueCapacity: ${ASYNC_QUEUE_CAPACITY:50}
  verification-code:
    effectiveTime: ${VERIFICATION_EFFECTIVE_TIME:300}
    watermark: ${VERIFICATION_WATERMARK:LILI-SHOP}
    interfereNum: ${VERIFICATION_INTERFERE_NUM:0}
    faultTolerant: ${VERIFICATION_FAULT_TOLERANT:3}
    loginBypassEnabled: ${VERIFICATION_LOGIN_BYPASS:false}
  data:
    rocketmq:
      promotion-topic: lili_promotion_topic
      promotion-group: lili_promotion_group
      order-topic: lili_order_topic
      order-group: lili_order_group
      goods-topic: lili_goods_topic
      goods-group: lili_goods_group
      member-topic: lili_member_topic
      member-group: lili_member_group
      notice-topic: lili_notice_topic
      notice-group: lili_notice_group
      notice-send-topic: lili_send_notice_topic
      notice-send-group: lili_send_notice_group
      store-topic: lili_store_topic
      store-group: lili_store_group
      after-sale-topic: lili_after_sale_topic
      after-sale-group: lili_after_sale_group

